# Regression tests for the guardrail scripts and the issue-ready script shipped in template/,
# plus two documentation checks.
# Runs tests/test-hooks.sh (Claude Code PreToolUse and SessionStart hooks),
# tests/test-issue-ready.sh (the issue-ready script, against a fake gh), tests/check-refs.py
# (every path cited in Markdown exists), tests/check-context-budget.py (the always-loaded
# instruction files stay under their line budget, and each skill file under 30,000 bytes),
# and shellcheck on every shell script in the repository.
name: test-hooks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run hook regression tests
        run: tests/test-hooks.sh
      - name: Run issue-ready script tests
        run: tests/test-issue-ready.sh
      - name: Check Markdown path references
        run: python3 tests/check-refs.py
      - name: Check context budgets (resident lines, skill file size)
        run: python3 tests/check-context-budget.py
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning \
            tests/test-hooks.sh \
            tests/test-issue-ready.sh \
            template/.claude/hooks/*.sh \
            template/.claude/scripts/*.sh
